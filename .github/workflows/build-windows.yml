name: Build Windows Package

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute package metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=Bomberman-windows-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        run: python build_config.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Bomberman.exe")) {
            throw "Missing dist/Bomberman.exe after PyInstaller build."
          }

      - name: Prepare distributable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/Bomberman.exe" "release/Bomberman.exe"
          Copy-Item "README.md" "release/README.md"
          Compress-Archive -Path "release/*" -DestinationPath "dist/${{ steps.meta.outputs.zip_name }}" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: bomberman-windows-${{ steps.meta.outputs.version }}
          path: dist/${{ steps.meta.outputs.zip_name }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.zip_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
